<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Control de Limpieza — Bio-Fix</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Esta pantalla habla con OTRO Apps Script (el de Control de Limpieza), no con el de Trazabilidad -->
<script>
  window.BIOFIX_API_URL = 'https://script.google.com/macros/s/AKfycbyqmpeX8x0imsfYtDySIEGveKRI_SSGvXKrLQj0yiUrKsfyTLSX4coe2aIFWNmqdase5g/exec';
  window.BIOFIX_PANTALLA = 'limpieza';
  // Funciones que NO son guardados: gas.js no las mete en la cola de "guardados en la tablet"
  window.BIOFIX_LECTURAS = ['limpiezaInit', 'limpiezaCargar', 'limpiezaRegistroDia', 'limpiezaRegistroUltimos',
                            'limpiezaPdfSemana', 'limpiezaPdfRegistroMes'];
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js" integrity="sha384-BWcjm9OdFth9TbhCxZPdm+gAOUMAzQy9nmTs12ioXdCcbVnJaPMn+fMUoQCLt60R" crossorigin="anonymous"></script>
<script src="config.js"></script>
<script src="gas.js"></script>
<style>
  :root { --teal:#2f7f86; --teal2:#cfe2e3; --verde:#e8f0d8; --rojo:#c62828; --gris:#f4f6f7; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:Arial, sans-serif; background:var(--gris); color:#222; }
  header { background:var(--teal); color:#fff; padding:14px 16px; }
  header h1 { margin:0; font-size:18px; }
  header small { opacity:.85; }
  .tabs { display:flex; gap:4px; padding:8px 16px 0; background:#fff; border-bottom:1px solid #ddd; flex-wrap:wrap; }
  .tab { border:0; background:none; padding:10px 14px; font-size:14px; cursor:pointer; border-bottom:3px solid transparent; color:#555; }
  .tab.on { border-color:var(--teal); color:var(--teal); font-weight:bold; }
  main { max-width:900px; margin:0 auto; padding:16px; }
  .card { background:#fff; border-radius:8px; padding:14px; margin-bottom:12px; box-shadow:0 1px 2px rgba(0,0,0,.08); }
  .fila { display:flex; gap:12px; flex-wrap:wrap; }
  .fila > label { flex:1 1 160px; }
  label { display:block; font-size:12px; color:#555; }
  input, select, textarea { width:100%; padding:8px; font-size:15px; border:1px solid #bbb; border-radius:6px; margin-top:4px; }
  textarea { min-height:60px; }
  .grupo { background:var(--verde); font-weight:bold; padding:6px 8px; border-radius:4px; margin:14px 0 6px; }
  .item { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:6px 4px; border-bottom:1px solid #eee; }
  .item span { flex:1; font-size:14px; }
  .sn { display:flex; gap:4px; }
  .sn button { width:46px; padding:8px 0; border:1px solid #bbb; background:#fff; border-radius:6px; cursor:pointer; font-weight:bold; color:#555; }
  .sn button.on[data-v=SI] { background:#2e7d32; color:#fff; border-color:#2e7d32; }
  .sn button.on[data-v=NO] { background:var(--rojo); color:#fff; border-color:var(--rojo); }
  .sn button.on[data-v=NA] { background:#757575; color:#fff; border-color:#757575; }
  .item.falta span { color:var(--rojo); }
  .acciones { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
  .btn { padding:11px 16px; border:0; border-radius:6px; font-size:15px; cursor:pointer; background:var(--teal); color:#fff; }
  .btn.sec { background:#fff; color:var(--teal); border:1px solid var(--teal); }
  .btn:disabled { opacity:.5; cursor:default; }
  .msg { padding:10px 12px; border-radius:6px; margin-bottom:12px; display:none; }
  .msg.ok { display:block; background:#e8f5e9; color:#1b5e20; }
  .msg.err { display:block; background:#ffebee; color:#b71c1c; }
  .aviso { font-size:12px; color:#2f7f86; margin-top:6px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { border-bottom:1px solid #eee; padding:6px; text-align:left; }
  th { background:var(--teal2); }
  .oculto { display:none; }
  @media (max-width:520px){ .sn button { width:40px; } .item span { font-size:13px; } }
</style>
</head>
<body>
<header>
  <h1>Control de Limpieza</h1>
  <small>Grado Cuatro SRL — Bio-Fix</small>
</header>
<div class="tabs">
  <button class="tab on" data-t="PA">Planta Alta</button>
  <button class="tab" data-t="BA">Baños</button>
  <button class="tab" data-t="REG">Registro Baño</button>
</div>
<main>
  <div id="msg" class="msg"></div>

  <!-- CHECKLIST (Planta Alta / Baños) -->
  <section id="secCheck">
    <div class="card">
      <div id="tituloCheck" style="font-weight:bold;margin-bottom:8px"></div>
      <div class="fila">
        <label>Fecha <input type="date" id="cFecha"></label>
        <label>Hora limpieza y desinfección <input type="time" id="cHora"></label>
        <label>Responsable <select id="cResp"></select></label>
      </div>
      <div id="boxFuera" class="fila oculto" style="margin-top:10px">
        <label>Baño fuera de servicio
          <select id="cFuera"><option value="">—</option><option>NO</option><option>SI</option></select>
        </label>
      </div>
      <div id="avisoCarga" class="aviso"></div>
    </div>
    <div class="card">
      <div class="acciones" style="margin-top:0">
        <button class="btn sec" type="button" id="btnTodoSi">Marcar todo SI</button>
      </div>
      <div id="items"></div>
    </div>
    <div class="card">
      <label>Condiciones y/o recomendaciones <textarea id="cCond"></textarea></label>
      <div class="acciones">
        <button class="btn" id="btnGuardar">Guardar</button>
        <button class="btn sec" id="btnPdfSemana">PDF de la semana</button>
      </div>
    </div>
  </section>

  <!-- REGISTRO DIARIO DE BAÑO -->
  <section id="secReg" class="oculto">
    <div class="card">
      <div style="font-weight:bold;margin-bottom:8px">Control de Limpieza - Baño (registro diario)</div>
      <div class="fila">
        <label>Fecha <input type="date" id="rFecha"></label>
        <label>Hora <input type="time" id="rHora"></label>
        <label>Operaria <select id="rOper"></select></label>
      </div>
      <div id="rEstado" class="aviso"></div>
      <label style="margin-top:10px">Observaciones <textarea id="rObs"></textarea></label>
      <label style="display:flex;gap:8px;align-items:center;margin-top:10px;font-size:14px;color:#222">
        <input type="checkbox" id="rFirma" style="width:auto;margin:0"> Confirmo y firmo esta limpieza
      </label>
      <div class="acciones">
        <button class="btn" id="btnRegistrar">Registrar limpieza</button>
        <button class="btn sec" id="btnPdfMes">PDF del mes</button>
      </div>
    </div>
    <div class="card">
      <div style="font-weight:bold;margin-bottom:8px">Últimos registros</div>
      <table><thead><tr><th>Fecha</th><th>Hora 1</th><th>Hora 2</th><th>Operaria</th><th>Observaciones</th></tr></thead>
        <tbody id="tbReg"></tbody></table>
    </div>
  </section>
</main>

<script>
  var CFG = null, actual = 'PA', resultados = {};
  var $ = function (id) { return document.getElementById(id); };

  function msg(t, ok) { var m = $('msg'); m.textContent = t; m.className = 'msg ' + (ok ? 'ok' : 'err'); window.scrollTo(0, 0); }
  function limpiarMsg() { $('msg').className = 'msg'; }
  function run(fn, args, ok, btn) {
    if (btn) btn.disabled = true;
    var r = google.script.run
      .withSuccessHandler(function (x) { if (btn) btn.disabled = false; ok(x); })
      .withFailureHandler(function (e) { if (btn) btn.disabled = false; msg(e.message || String(e), false); });
    r[fn].apply(r, args || []);
  }
  function opciones(sel, lista) {
    sel.innerHTML = '<option value="">Elegí…</option>' + lista.map(function (n) { return '<option>' + n + '</option>'; }).join('');
  }

  /* ---------- checklist ---------- */
  function pintarChecklist() {
    var p = CFG.planillas[actual];
    $('tituloCheck').textContent = p.codigo + ' — ' + p.titulo;
    $('boxFuera').classList.toggle('oculto', !p.fueraServicio);
    var h = '';
    p.grupos.forEach(function (g) {
      h += '<div class="grupo">' + g.nombre + '</div>';
      g.items.forEach(function (it) {
        var k = g.nombre + '|' + it;
        h += '<div class="item" data-k="' + k.replace(/"/g, '&quot;') + '"><span>' + it + '</span><div class="sn">' +
          ['SI', 'NO', 'NA'].map(function (v) { return '<button type="button" data-v="' + v + '">' + v + '</button>'; }).join('') +
          '</div></div>';
      });
    });
    $('items').innerHTML = h;
    marcar();
  }
  function marcar() {
    document.querySelectorAll('#items .item').forEach(function (el) {
      var v = resultados[el.getAttribute('data-k')];
      el.querySelectorAll('button').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-v') === v); });
    });
  }
  $('items').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    var it = b.closest('.item');
    resultados[it.getAttribute('data-k')] = b.getAttribute('data-v');
    it.classList.remove('falta');
    marcar();
  });
  $('btnTodoSi').onclick = function () {
    document.querySelectorAll('#items .item').forEach(function (el) { resultados[el.getAttribute('data-k')] = 'SI'; el.classList.remove('falta'); });
    marcar();
  };
  function cargarDia() {
    limpiarMsg();
    resultados = {}; $('cCond').value = ''; $('cFuera').value = ''; $('avisoCarga').textContent = '';
    pintarChecklist();
    run('limpiezaCargar', [actual, $('cFecha').value], function (d) {
      if (!d) return;
      resultados = d.resultados || {};
      if (d.hora) $('cHora').value = d.hora;
      if (d.responsable) $('cResp').value = d.responsable;
      $('cFuera').value = d.fueraServicio || '';
      $('cCond').value = d.condiciones || '';
      $('avisoCarga').textContent = 'Este día ya estaba cargado: si guardás, se reemplaza.';
      marcar();
    });
  }
  $('cFecha').onchange = cargarDia;
  $('btnGuardar').onclick = function () {
    var faltan = 0;
    document.querySelectorAll('#items .item').forEach(function (el) {
      var f = !resultados[el.getAttribute('data-k')]; el.classList.toggle('falta', f); if (f) faltan++;
    });
    if (faltan) { msg('Faltan marcar ' + faltan + ' elemento(s) (en rojo).', false); return; }
    run('limpiezaGuardar', [{
      planilla: actual, fecha: $('cFecha').value, hora: $('cHora').value, responsable: $('cResp').value,
      fueraServicio: $('cFuera').value, condiciones: $('cCond').value, resultados: resultados
    }], function (t) { msg(t, true); $('avisoCarga').textContent = 'Este día ya estaba cargado: si guardás, se reemplaza.'; }, this);
  };
  $('btnPdfSemana').onclick = function () {
    msg('Generando PDF…', true);
    run('limpiezaPdfSemana', [actual, $('cFecha').value], function (url) {
      $('msg').innerHTML = 'PDF generado: <a href="' + url + '" target="_blank">abrir</a>'; $('msg').className = 'msg ok';
    }, this);
  };

  /* ---------- registro baño ---------- */
  function cargarRegistro() {
    $('rEstado').textContent = '';
    run('limpiezaRegistroDia', [$('rFecha').value], function (d) {
      if (!d) { $('rEstado').textContent = 'Sin limpiezas registradas ese día: se registra la Limpieza 1.'; return; }
      if (d.hora2) $('rEstado').textContent = 'Ese día ya tiene las 2 limpiezas (' + d.hora1 + ' y ' + d.hora2 + ').';
      else $('rEstado').textContent = 'Limpieza 1 a las ' + d.hora1 + ' (' + d.operaria + '). Ahora se registra la Limpieza 2.';
    });
    run('limpiezaRegistroUltimos', [15], function (lista) {
      $('tbReg').innerHTML = lista.map(function (r) {
        return '<tr><td>' + r.fecha + '</td><td>' + (r.hora1 || '') + '</td><td>' + (r.hora2 || '—') + '</td><td>' + (r.operaria || '') + '</td><td>' + (r.observaciones || '') + '</td></tr>';
      }).join('') || '<tr><td colspan="5">Sin registros todavía.</td></tr>';
    });
  }
  $('rFecha').onchange = cargarRegistro;
  $('btnRegistrar').onclick = function () {
    run('limpiezaRegistrarBano', [{
      fecha: $('rFecha').value, hora: $('rHora').value, operaria: $('rOper').value,
      observaciones: $('rObs').value, firma: $('rFirma').checked
    }], function (t) { msg(t, true); $('rObs').value = ''; $('rFirma').checked = false; cargarRegistro(); }, this);
  };
  $('btnPdfMes').onclick = function () {
    msg('Generando PDF…', true);
    run('limpiezaPdfRegistroMes', [$('rFecha').value], function (url) {
      $('msg').innerHTML = 'PDF generado: <a href="' + url + '" target="_blank">abrir</a>'; $('msg').className = 'msg ok';
    }, this);
  };

  /* ---------- pestañas ---------- */
  document.querySelectorAll('.tab').forEach(function (t) {
    t.onclick = function () {
      document.querySelectorAll('.tab').forEach(function (x) { x.classList.toggle('on', x === t); });
      actual = t.getAttribute('data-t');
      limpiarMsg();
      var esReg = actual === 'REG';
      $('secCheck').classList.toggle('oculto', esReg);
      $('secReg').classList.toggle('oculto', !esReg);
      if (esReg) cargarRegistro(); else cargarDia();
    };
  });

  run('limpiezaInit', [], function (cfg) {
    CFG = cfg;
    opciones($('cResp'), cfg.operarias); opciones($('rOper'), cfg.operarias);
    $('cFecha').value = cfg.hoy; $('rFecha').value = cfg.hoy;
    $('cHora').value = cfg.hora; $('rHora').value = cfg.hora;
    cargarDia();
  });
</script>
</body>
</html>
