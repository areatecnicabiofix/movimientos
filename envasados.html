<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f4f6f9;
        padding: 20px;
        color: #333;
        font-size: 16px;
      }
      .container {
        max-width: 1500px;
        width: 95%;
        margin: auto;
        background: white;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      }
      h2 {
        color: #1a73e8;
        text-align: center;
        margin-bottom: 25px;
        font-size: 26px;
      }
      fieldset {
        border: 1px solid #ddd;
        border-radius: 6px;
        padding: 20px;
        margin-bottom: 20px;
      }
      legend {
        font-weight: bold;
        color: #1a73e8;
        padding: 0 5px;
        font-size: 18px;
      }
      label {
        font-weight: bold;
        display: block;
        margin-top: 10px;
        font-size: 14px;
      }
      input, select {
        width: 100%;
        padding: 10px;
        margin-top: 4px;
        box-sizing: border-box;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 15px;
      }
      button.enviar {
        background: #1a73e8;
        color: white;
        border: none;
        padding: 16px;
        width: 100%;
        margin-top: 15px;
        border-radius: 6px;
        font-weight: bold;
        font-size: 18px;
        cursor: pointer;
      }
      button.enviar:hover { background: #1557b0; }
      button.enviar:disabled { background: #9ab8e8; cursor: not-allowed; }
      .mensaje { margin-top: 15px; text-align: center; font-weight: bold; font-size: 15px; }

      /* Tarjeta por fila (medida o componente) */
      .fila-cierre {
        border: 1px solid #e0e0e0;
        border-radius: 6px;
        padding: 14px 16px;
        margin-bottom: 14px;
        background: #fafafa;
      }
      .fila-cierre.cerrada {
        background: #eef9ef;
        border-color: #b7e0bb;
      }
      .fila-header {
        font-size: 15px;
        margin-bottom: 8px;
      }
      .badge-cerrada {
        background: #34a853;
        color: white;
        font-size: 12px;
        padding: 3px 8px;
        border-radius: 10px;
        margin-left: 8px;
      }
      .badge-componente {
        background: #f9ab00;
        color: white;
        font-size: 12px;
        padding: 3px 8px;
        border-radius: 10px;
        margin-left: 8px;
      }
      .fila-inputs {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 10px;
      }
      .fila-inputs label { margin-top: 0; font-size: 12px; }
      .fila-inputs input { padding: 8px; font-size: 14px; }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Cerrar Envasado Primario</h2>

      <fieldset>
        <legend>Lote pendiente de cierre</legend>
        <label>Lote:</label>
        <select id="lotePendiente" onchange="cargarDetalleLote()">
          <option value="">Cargando lotes...</option>
        </select>
        <div id="infoLotePendiente" style="margin-top:6px; font-size:14px; color:#555;"></div>
      </fieldset>

      <fieldset id="fieldsetFilas" style="display:none;">
        <legend>Medidas / componentes a cerrar</legend>
        <div id="contenedorFilas"></div>
      </fieldset>

      <button type="button" class="enviar" id="btnGuardar" style="display:none;" onclick="guardarCierre()">
        Guardar cierre de Envasado Primario
      </button>
      <div class="mensaje" id="mensaje"></div>
    </div>

    <script>
      var lotesPendientes = [];
      var detalleActual = [];

      function cargarLotesPendientes() {
        var select = document.getElementById('lotePendiente');
        select.innerHTML = '<option value="">Cargando lotes...</option>';
        google.script.run
          .withSuccessHandler(function (lista) {
            lotesPendientes = lista || [];
            if (lotesPendientes.length === 0) {
              select.innerHTML = '<option value="">No hay lotes en espera</option>';
              return;
            }
            select.innerHTML = '<option value="">Seleccione un lote...</option>' +
              lotesPendientes.map(function (item) {
                return '<option value="' + item.clave + '">Lote ' + item.sistema + '-' + item.lote +
                  ' - ' + item.producto + ' (' + item.fecha + ')</option>';
              }).join('');
          })
          .withFailureHandler(function (err) {
            select.innerHTML = '<option value="">Error al cargar lotes</option>';
            var msg = document.getElementById('mensaje');
            msg.style.color = 'red';
            msg.innerText = 'Error al cargar lotes pendientes: ' + err.message;
          })
          .obtenerLotesPendientes();
      }

      function cargarDetalleLote() {
        var clave = document.getElementById('lotePendiente').value;
        var info = document.getElementById('infoLotePendiente');
        var fieldsetFilas = document.getElementById('fieldsetFilas');
        var btnGuardar = document.getElementById('btnGuardar');
        var contenedor = document.getElementById('contenedorFilas');
        document.getElementById('mensaje').innerText = '';

        if (!clave) {
          fieldsetFilas.style.display = 'none';
          btnGuardar.style.display = 'none';
          info.innerText = '';
          contenedor.innerHTML = '';
          return;
        }

        var item = lotesPendientes.find(function (l) { return String(l.clave) === String(clave); });
        info.innerText = item
          ? ('Sistema: ' + item.sistema + ' | Producto: ' + item.producto + ' | Fecha de carga: ' + item.fecha)
          : '';

        contenedor.innerHTML = '<p>Cargando medidas...</p>';
        fieldsetFilas.style.display = 'block';
        btnGuardar.style.display = 'none';

        google.script.run
          .withSuccessHandler(function (detalle) {
            detalleActual = detalle || [];
            renderFilas();
            btnGuardar.style.display = 'block';
          })
          .withFailureHandler(function (err) {
            contenedor.innerHTML = '<p style="color:red;">Error al cargar las medidas del lote: ' + err.message + '</p>';
          })
          .obtenerDetalleLote(clave);
      }

      function renderFilas() {
        var contenedor = document.getElementById('contenedorFilas');
        contenedor.innerHTML = '';

        var hayPendientes = detalleActual.some(function (f) { return !f.yaCerrada; });

        detalleActual.forEach(function (f) {
          var card = document.createElement('div');
          card.className = 'fila-cierre' + (f.yaCerrada ? ' cerrada' : '');

          if (f.yaCerrada) {
            card.innerHTML =
              '<div class="fila-header"><strong>' + f.medida + '</strong> — Cantidad: ' + f.cantidad +
              '<span class="badge-cerrada">&#10003; Ya cerrada</span></div>';
            contenedor.appendChild(card);
            return;
          }

          var badgeComponente = f.esComponente ? '<span class="badge-componente">Componente</span>' : '';
          card.innerHTML =
            '<div class="fila-header"><strong>' + f.medida + '</strong> — Cantidad: ' + f.cantidad + badgeComponente + '</div>' +
            '<div class="fila-inputs" data-fila="' + f.fila + '" data-componente="' + (f.esComponente ? '1' : '0') + '">' +
              '<div><label>O.F PROD</label><input type="text" class="in-ofProd"></div>' +
              '<div><label>O.F LAV. FINAL</label><input type="text" class="in-ofLavado"></div>' +
              '<div><label>LOTE TAPÓN</label>' + (f.esComponente
                ? '<input type="text" class="in-loteTap" value="No aplica" disabled style="background:#f1f5f9;color:#94a3b8;">'
                : '<input type="text" class="in-loteTap">'
              ) + '</div>' +
              '<div><label>REFERENCIA</label>' + (f.esComponente
                ? '<select class="in-referencia" disabled><option value="">No aplica</option></select>'
                : '<select class="in-referencia"><option value="">-- Elegir --</option>' +
                  ['0','1','2','3','4','5'].map(function (n) { return '<option value="' + n + '">' + n + '</option>'; }).join('') +
                  '</select>'
              ) + '</div>' +
              '<div><label>OPERARIO</label><input type="text" class="in-operario" value="Miguel Gomez"></div>' +
            '</div>';
          contenedor.appendChild(card);
        });

        if (!hayPendientes) {
          var aviso = document.createElement('p');
          aviso.innerText = 'Todas las filas de este lote ya están cerradas.';
          contenedor.appendChild(aviso);
        }

      }

      // Las filas de componentes (Tapa de Cierre, Pilar, Tornillo) no
      // tienen su propio LOTE TAPÓN: ese dato solo aplica a las medidas
      // de implante, así que para los componentes el campo queda
      // deshabilitado ("No aplica") y no se pide ni se guarda un valor.

      function guardarCierre() {
        var clave = document.getElementById('lotePendiente').value;
        if (!clave) { alert('Seleccioná un lote.'); return; }

        var filas = [];
        var faltantes = false;

        document.querySelectorAll('.fila-cierre:not(.cerrada)').forEach(function (card) {
          var bloqueInputs = card.querySelector('.fila-inputs');
          if (!bloqueInputs) return; // fila sin inputs (no debería pasar salvo "todo cerrado")

          var esComponente = bloqueInputs.getAttribute('data-componente') === '1';
          var numFila = bloqueInputs.getAttribute('data-fila');
          var ofProd = bloqueInputs.querySelector('.in-ofProd').value.trim();
          var ofLavado = bloqueInputs.querySelector('.in-ofLavado').value.trim();
          var loteTap = esComponente ? '-' : bloqueInputs.querySelector('.in-loteTap').value.trim();
          var referencia = bloqueInputs.querySelector('.in-referencia').value.trim();
          var operario = bloqueInputs.querySelector('.in-operario').value.trim();

          if (!ofProd || !ofLavado || (!esComponente && !loteTap) || !operario) {
            faltantes = true;
            return;
          }

          filas.push({
            fila: numFila,
            ofProd: ofProd,
            ofLavado: ofLavado,
            loteTap: loteTap,
            referencia: referencia,
            operario: operario
          });
        });

        if (faltantes) {
          alert('Completá O.F PROD, O.F LAV. FINAL, LOTE TAPÓN y OPERARIO en todas las filas pendientes antes de guardar.\n(La Referencia puede quedar vacía si no aplica.)');
          return;
        }
        if (filas.length === 0) {
          alert('No hay filas pendientes para guardar en este lote.');
          return;
        }

        var btn = document.getElementById('btnGuardar');
        var msg = document.getElementById('mensaje');
        btn.disabled = true;
        msg.style.color = '#333';
        msg.innerText = 'Guardando cierre...';

        google.script.run
          .withSuccessHandler(function (res) {
            msg.style.color = 'green';
            msg.innerText = res;
            btn.disabled = false;
            // Ya NO redirige solo al Envasado Secundario (no andaba bien
            // desde el iframe de Apps Script). En vez de eso, se limpia la
            // pantalla y se refresca al toque la lista de lotes pendientes,
            // igual que en Envasado Secundario/Anexo.
            document.getElementById('fieldsetFilas').style.display = 'none';
            btn.style.display = 'none';
            document.getElementById('infoLotePendiente').innerText = '';
            document.getElementById('contenedorFilas').innerHTML = '';
            document.getElementById('lotePendiente').value = '';
            cargarLotesPendientes();
          })
          .withFailureHandler(function (err) {
            msg.style.color = 'red';
            msg.innerText = 'Error: ' + err.message;
            btn.disabled = false;
          })
          .guardarPaso2({ clave: clave, filas: filas });
      }

      window.onload = function () {
        cargarLotesPendientes();
      };
    </script>
  </body>
</html>
