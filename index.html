<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bio-Fix — Producción</title>
<!-- Inicio: cada puesto va DIRECTO a su pantalla. Solo "tecnica" ve el menú completo. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="gas.js"></script>
<style>
  :root{ --bx:#e2e8f0; --tx:#0f172a; --mut:#64748b; }
  *{ box-sizing:border-box; font-family:Arial, sans-serif; }
  body{ background:#f8fafc; color:var(--tx); margin:0; padding:16px; }
  .container{ max-width:720px; margin:0 auto; }
  h1{ font-size:20px; color:#0369a1; margin:8px 0 4px; }
  .sub{ font-size:13px; color:var(--mut); margin-bottom:18px; }
  h2{ font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--mut); margin:22px 0 8px; }
  .grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(200px, 1fr)); gap:10px; }
  a.card{ display:block; background:#fff; border:1px solid var(--bx); border-radius:12px; padding:14px 16px; text-decoration:none; color:var(--tx); }
  a.card:hover{ border-color:#93c5fd; }
  .t{ font-weight:700; font-size:15px; }
  .d{ font-size:12px; color:var(--mut); margin-top:4px; }
  .tag{ display:inline-block; font-size:10px; font-weight:700; padding:2px 7px; border-radius:6px; margin-top:8px; }
  .tag.nuevo{ background:#dcfce7; color:#15803d; }
  .tag.as{ background:#f1f5f9; color:#64748b; }
  .hide{ display:none; }
</style>
</head>
<body>
<div class="container">
  <div id="estado" class="sub">Cargando…</div>

  <!-- Solo lo ve el usuario "tecnica" -->
  <div id="menu" class="hide">
    <h1>Bio-Fix — Producción</h1>
    <div class="sub">Menú completo (usuario técnico).</div>
    <h2>GitHub</h2>
    <div class="grid" id="nuevas"></div>
    <h2>Apps Script (versiones anteriores)</h2>
    <div class="grid" id="viejas"></div>
  </div>
</div>

<script>
  /* Qué pantalla abre cada puesto. Para sumar un sector: agregar su línea acá
     y crear el usuario <sector>@biofix.com en Supabase. */
  var PANTALLA_DE = {
    deposito:   'deposito.html',
    mecanizado: 'mecanizado.html',
    lavado:     'lavado.html',
    lavados:    'lavados.html',
    blasting:   'blasting.html',
    control:    'control.html',
    grabado:    'grabado.html'
  };

  var NUEVAS = [
    { t: 'Supervisión',            d: 'Auditoría, historia de lote y estadística de cotas', href: 'supervision.html' },
    { t: 'Depósito',               d: 'Semielaborado, Sala Blanca y Componentes', href: 'deposito.html' },
    { t: 'Depósito — Lavado Final',d: 'Envío a Lavado Final',                     href: 'depositolf.html' },
    { t: 'Mecanizado',             d: 'Máquina, cierres y control de piezas',     href: 'mecanizado.html' },
    { t: 'Lavado',                 d: 'Primario, Abrillantado, Vaporeado, Secundario', href: 'lavado.html' },
    { t: 'Lavados Grueso / Final', d: 'Lavado Grueso y Lavado Final',             href: 'lavados.html' },
    { t: 'Control de Calidad',     d: 'Control por cotas',                        href: 'control.html' },
    { t: 'Blasting',               d: 'Bandejas, blastinado y control',           href: 'blasting.html' },
    { t: 'Grabado Láser',          d: 'Componentes a grabar',                     href: 'grabado.html' }
  ];
  var VIEJAS = [
    { t: 'Mecanizado', v: '' }, { t: 'Lavado', v: 'lavado' }, { t: 'Control de Calidad', v: 'control' },
    { t: 'Lavados Grueso / Final', v: 'lavados' }, { t: 'Blasting', v: 'blasting' },
    { t: 'Depósito', v: 'deposito' }, { t: 'Depósito — Lavado Final', v: 'depositolf' }, { t: 'Grabado Láser', v: 'grabado' }
  ];

  BIOFIX.sesion.then(function (session) {
    var u = BIOFIX.sectorDe(session);
    var admins = (BIOFIX_CFG.admins || []);

    if (admins.indexOf(u) >= 0) {
      document.getElementById('estado').classList.add('hide');
      document.getElementById('menu').classList.remove('hide');
      document.getElementById('nuevas').innerHTML = NUEVAS.map(function (x) {
        return '<a class="card" href="' + x.href + '"><div class="t">' + x.t + '</div><div class="d">' + x.d + '</div><span class="tag nuevo">GitHub</span></a>';
      }).join('');
      document.getElementById('viejas').innerHTML = VIEJAS.map(function (x) {
        return '<a class="card" href="' + BIOFIX_CFG.apiUrl + (x.v ? '?v=' + x.v : '') + '" target="_top"><div class="t">' + x.t + '</div><span class="tag as">Apps Script</span></a>';
      }).join('');
      return;
    }

    if (PANTALLA_DE[u]) { location.replace(PANTALLA_DE[u]); return; }

    document.getElementById('estado').innerHTML =
      'El puesto <b>' + u + '</b> todavía no tiene una pantalla asignada. Avisale al área técnica.';
  });
</script>
</body>
</html>
